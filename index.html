<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            height: 100vh;
            width: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            background-color: black;
        }

        #game-board {
            background: #FFF;
            width: 100vmin;
            height: 100vmin;
            display: grid;
            grid-template-rows: repeat(21, 1fr);
            grid-template-columns: repeat(21,1fr);
        }

        /* HERE WE ARE CREATING SNAKE SO WE CAN INSERT IT IN A JAVASCRIPT */
        .snake {
            background-color: #badd78;
            border: .25vmin solid black;
        }

        /* WE ARE CREATING FOOD AS USING THE FOOD OUR SNAKE WIL GROW */
        .food {
            background-color: #ad2f2f;
            border: .25vmin solid black;
        }
    </style>

    
    <!-- HERE WE WILL BE USING MULTIPLE SCRIPT FILES FOR THE LOGIC AND WE ARE GOING TO PASS THE DATA FROM ONE FILE TO ANOTHER SO FOR THIS REASON WE HAVE USED FEATURE AS MODULE WE ARE GOING TO DO SAME THING IN REACT JS -->
    <script defer type="module" src="game.js" ></script> 

</head>
<body>
    <div id="game-board"></div>
</body>
</html>
